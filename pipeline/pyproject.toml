[project]
name = "planos"
version = "0.1.0"
description = "DXF floor plan -> space JSON -> GLB pipeline"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "trimesh>=4.4",
    "manifold3d>=2.5",
    "numpy>=1.26",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pygltflib>=1.16",
]

[project.scripts]
planos = "planos.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
